<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice2Sign - Settings</title>
    <link rel="icon" type="image/png" href="images/transparent-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/settings-page.css">
</head>
<body>
    <header class="header">
        <a href="dashboard.html" class="logo">
            <img src="images/transparent-logo.png" alt="Voice2Sign" onerror="this.style.display='none'">
        </a>
        <div class="header-actions">
            <a href="dashboard.html" class="btn-secondary">Back to dashboard</a>
        </div>
    </header>

    <main class="main">
        <section class="settings-card card">
            <div class="settings-head">
                <img src="images/transparent-logo.png" alt="Voice2Sign logo" class="settings-logo">
                <div>
                    <h1 class="card-title">Application settings</h1>
                    <p class="card-subtitle">Configure backend and account defaults.</p>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="apiBaseUrl">Backend API URL</label>
                <input class="form-input" id="apiBaseUrl" type="text" placeholder="http://127.0.0.1:8000">
            </div>

            <div class="name-grid">
                <div class="form-group">
                    <label class="form-label" for="defaultLanguage">Default language</label>
                    <select class="form-input" id="defaultLanguage">
                        <option value="English">English</option>
                        <option value="Filipino">Filipino</option>
                        <option value="Spanish">Spanish</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="responseStyle">Response style</label>
                    <select class="form-input" id="responseStyle">
                        <option value="concise">Concise</option>
                        <option value="balanced">Balanced</option>
                        <option value="detailed">Detailed</option>
                    </select>
                </div>
            </div>

            <div class="checkbox-grid">
                <label class="checkbox-wrapper"><input id="autoCamera" class="checkbox" type="checkbox"><span class="checkbox-label">Auto-open camera on launch</span></label>
                <label class="checkbox-wrapper"><input id="soundAlerts" class="checkbox" type="checkbox"><span class="checkbox-label">Enable sound notifications</span></label>
            </div>

            <div class="settings-actions">
                <button class="btn-secondary" type="button" onclick="testBackendConnection()">Test connection</button>
                <button class="btn-primary" type="button" onclick="saveAppSettings()">Save settings</button>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script src="js/settings-page.js"></script>
</body>
</html>
