<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice2Sign - Forgot Password</title>
    <link rel="icon" type="image/png" href="images/transparent-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
    <header class="header">
        <a href="dashboard.html" class="logo">
            <img src="images/transparent-logo.png" alt="Voice2Sign" onerror="this.style.display='none'">
        </a>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme">
                <svg id="themeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="main">
        <section class="forgot-card card">
            <img src="images/transparent-logo.png" alt="Voice2Sign logo" class="forgot-logo">
            <h1 class="card-title">Reset your password</h1>
            <p class="card-subtitle">Enter your email and we will send a secure reset link.</p>
            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" id="email" type="email" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn-primary">Send reset link</button>
            </form>
            <p class="back-text">Remembered your password? <a class="link" href="login.html">Back to sign in</a></p>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
