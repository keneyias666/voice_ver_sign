# Example: app + PostgreSQL. Use: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice2sign
      POSTGRES_PASSWORD: voice2sign
      POSTGRES_DB: voice2sign
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice2sign -d voice2sign"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://voice2sign:voice2sign@db:5432/voice2sign
      CORS_ORIGINS: "*"
      # Set a strong secret in real deployments:
      # V2S_SECRET: ...
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
