<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice2Sign - Reset Password</title>
    <meta name="description" content="Reset your Voice2Sign account password.">
    <link rel="icon" type="image/png" href="images/transparent-logo.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth-page">
    <div class="background-logos"
        style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden;">
        <img src="images/transparent-logo.svg"
            style="position:absolute; width: 450px; opacity:0.04; animation: floatWide1 25s infinite alternate ease-in-out; top: 5%; left:-5%;"
            alt="">
    </div>

    <header class="auth-header">
        <a href="dashboards/hearing.html" class="auth-logo">
            <img src="images/transparent-logo.svg" alt="Voice2Sign" onerror="this.style.display='none'">
            <span class="auth-logo-text">Voice2Sign</span>
        </a>
        <div class="auth-header-actions">
            <button type="button" class="icon-btn theme-toggle-control" onclick="toggleTheme(event)"
                aria-label="Toggle dark or light theme">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path data-theme-icon stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>
    </header>

    <main class="auth-body" style="gap: 8vw; flex-wrap: wrap; padding: 24px 5vw;">

        <div class="auth-intro"
            style="position:relative; z-index:1; max-width: 480px; text-align: left; margin-bottom: 32px;">
            <div
                style="margin-bottom: 24px; display:inline-flex; align-items:center; gap:12px; padding: 8px 16px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 30px; backdrop-filter: blur(10px);">
                <span
                    style="display:inline-block; width:8px; height:8px; background:#e0b694; border-radius:50%; box-shadow: 0 0 10px #e0b694;"></span>
                <span
                    style="font-size:13px; font-weight:600; color:rgba(255,255,255,0.9); letter-spacing:1px; text-transform:uppercase;">Voice2Sign</span>
            </div>
            <h1
                style="font-size: 56px; font-weight: 800; margin-bottom: 24px; line-height: 1.1; letter-spacing: -1.5px; color: white;">
                Next-gen <br>
                <span
                    style="background: linear-gradient(135deg, #e0b694 0%, #b07d52 100%); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI
                    translation</span>
            </h1>
            <p style="font-size: 18px; color: rgba(255,255,255,0.75); line-height: 1.6; font-weight: 400;">
                Recover your access to Voice2Sign and resume experiencing seamless communication powered by advanced
                neural architecture.
            </p>
        </div>

        <div class="auth-card" style="position:relative; z-index:1;">
            <div class="auth-card-header">
                <img src="images/transparent-logo.svg" alt="Voice2Sign" class="auth-card-logo"
                    onerror="this.style.display='none'">
                <h1 class="auth-card-title">Reset your password</h1>
                <p class="auth-card-subtitle">Enter your email and we'll send a secure reset link</p>
            </div>

            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-input" id="email" type="email" placeholder="you@example.com" required>
                </div>
                <button type="submit" class="btn-primary">Send reset link</button>
            </form>

            <div class="auth-switch">
                Remembered your password? <a href="login.html">Back to sign in</a>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
